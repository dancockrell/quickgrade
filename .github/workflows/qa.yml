name: QuickGrade QA

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: quickgrade-qa-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Rebuild generated files
        run: python3 build.py
      - name: Install test dependencies
        working-directory: tools
        run: npm ci
      - name: Install Chromium
        working-directory: tools
        run: npx playwright install --with-deps chromium
      - name: Start QuickGrade
        run: |
          python3 serve.py --port 5200 --no-browser > /tmp/quickgrade-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5200/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/quickgrade-server.log
          exit 1
      - name: Fast scanner regression gate
        working-directory: tools
        run: |
          node check.js qrpacket
          node check.js qr.js
          node check.js packetflow
          node check.js anonymous-packet
          node check.js paper
          node check.js forms
          node check.js firstrun
      - name: Run full QA suite
        working-directory: tools
        run: npm test
      - name: Commit rebuilt generated files
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QuickGrade.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild generated QuickGrade bundle"
            git push origin HEAD:${{ github.head_ref }}
          fi
